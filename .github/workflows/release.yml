name: Build Solaris Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

env:
  APP_DIR: app
  CORE_DIR: core
  SIDECAR_NAME: solaris_core

jobs:
  build-backend:
    name: Build backend with Burrito
    runs-on: ubuntu-22.04

    env:
      HEX_CACERTS_PATH: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system certificates
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            openssl \
            p7zip-full \
            xz-utils

          sudo update-ca-certificates

          test -f "${HEX_CACERTS_PATH}"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.17.3"
          version-type: strict
          install-hex: true
          install-rebar: true

      - name: Verify Hex TLS configuration
        run: |
          echo "HEX_CACERTS_PATH=${HEX_CACERTS_PATH}"
          echo "SSL_CERT_FILE=${SSL_CERT_FILE}"
          mix hex.info

      - name: Restore Mix dependencies
        working-directory: ${{ env.CORE_DIR }}
        run: |
          mix deps.get

      - name: Build Burrito releases
        working-directory: ${{ env.CORE_DIR }}
        env:
          MIX_ENV: prod
        run: |
          mix release

      - name: Locate and prepare Burrito binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sidecars

          echo "Generated Burrito files:"
          find "${CORE_DIR}" \
            -type f \
            \( -iname "*linux*" -o -iname "*windows*" -o -iname "*.exe" \) \
            -not -path "*/deps/*" \
            -print

          linux_binary="$(
            find "${CORE_DIR}" \
              -type f \
              \( -iname "*linux*" -o -iname "*linux*x86_64*" \) \
              -not -path "*/deps/*" \
              -not -path "*/_build/*/lib/*" \
              | head -n 1
          )"

          windows_binary="$(
            find "${CORE_DIR}" \
              -type f \
              \( -iname "*windows*" -o -iname "*win64*" -o -iname "*.exe" \) \
              -not -path "*/deps/*" \
              -not -path "*/_build/*/lib/*" \
              | head -n 1
          )"

          if [ -z "${linux_binary}" ]; then
            echo "Linux Burrito binary was not found."
            exit 1
          fi

          if [ -z "${windows_binary}" ]; then
            echo "Windows Burrito binary was not found."
            exit 1
          fi

          echo "Linux Burrito binary:"
          echo "${linux_binary}"

          echo "Windows Burrito binary:"
          echo "${windows_binary}"

          cp "${linux_binary}" \
            "sidecars/${SIDECAR_NAME}-x86_64-unknown-linux-gnu"

          cp "${windows_binary}" \
            "sidecars/${SIDECAR_NAME}-x86_64-pc-windows-msvc.exe"

          chmod +x \
            "sidecars/${SIDECAR_NAME}-x86_64-unknown-linux-gnu"

          echo "Prepared sidecars:"
          ls -lah sidecars

          file sidecars/*

      - name: Upload backend sidecars
        uses: actions/upload-artifact@v4
        with:
          name: solaris-backend-sidecars
          path: |
            sidecars/solaris_core-x86_64-unknown-linux-gnu
            sidecars/solaris_core-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux AppImage
    needs: build-backend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend sidecars
        uses: actions/download-artifact@v4
        with:
          name: solaris-backend-sidecars
          path: downloaded-sidecars

      - name: Prepare Linux sidecar
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${APP_DIR}/src-tauri"

          echo "Downloaded sidecars:"
          find downloaded-sidecars \
            -maxdepth 3 \
            -type f \
            -print

          linux_sidecar="$(
            find downloaded-sidecars \
              -type f \
              -name "${SIDECAR_NAME}-x86_64-unknown-linux-gnu" \
              | head -n 1
          )"

          if [ -z "${linux_sidecar}" ]; then
            echo "Linux sidecar was not found."
            echo "Files downloaded from the artifact:"
            find downloaded-sidecars -type f -print
            exit 1
          fi

          target="${APP_DIR}/src-tauri/${SIDECAR_NAME}-x86_64-unknown-linux-gnu"

          cp "${linux_sidecar}" "${target}"
          chmod +x "${target}"

          echo "Prepared Linux sidecar:"
          ls -lah "${target}"
          file "${target}"

          if [ ! -x "${target}" ]; then
            echo "Linux sidecar does not have execute permission."
            exit 1
          fi

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          bun install --frozen-lockfile

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.APP_DIR }}/src-tauri -> target

      - name: Build AppImage
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ${{ env.APP_DIR }}
          args: --bundles appimage

      - name: Verify AppImage
        shell: bash
        run: |
          set -euo pipefail

          find "${APP_DIR}/src-tauri/target/release/bundle/appimage" \
            -maxdepth 1 \
            -type f \
            -name "*.AppImage" \
            -print

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: solaris-linux-appimage
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows installer
    needs: build-backend
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend sidecars
        uses: actions/download-artifact@v4
        with:
          name: solaris-backend-sidecars
          path: downloaded-sidecars

      - name: Prepare Windows sidecar
        shell: pwsh
        run: |
          $source = Get-ChildItem `
            -Path "downloaded-sidecars" `
            -Filter "${env:SIDECAR_NAME}-x86_64-pc-windows-msvc.exe" `
            -File `
            -Recurse

          if ($source.Count -eq 0) {
            Write-Error "Windows sidecar was not found."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "${env:APP_DIR}/src-tauri" | Out-Null

          $target = "${env:APP_DIR}/src-tauri/${env:SIDECAR_NAME}-x86_64-pc-windows-msvc.exe"

          Copy-Item `
            -Path $source[0].FullName `
            -Destination $target `
            -Force

          Write-Host "Prepared Windows sidecar:"
          Get-Item $target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore frontend dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          bun install --frozen-lockfile

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.APP_DIR }}/src-tauri -> target

      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ${{ env.APP_DIR }}
          args: --bundles nsis

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installerPath = "${env:APP_DIR}/src-tauri/target/release/bundle/nsis"

          $installers = Get-ChildItem `
            -Path $installerPath `
            -Filter "*-setup.exe" `
            -File

          if ($installers.Count -eq 0) {
            Write-Error "Windows installer was not found."
          }

          $installers | Format-Table FullName, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: solaris-windows-installer
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-22.04

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: solaris-linux-appimage
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: solaris-windows-installer
          path: release-assets

      - name: List release assets
        run: |
          find release-assets \
            -maxdepth 2 \
            -type f \
            -print

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Uploading assets..."

            gh release upload \
              "${TAG_NAME}" \
              release-assets/* \
              --clobber
          else
            echo "Creating release ${TAG_NAME}..."

            gh release create \
              "${TAG_NAME}" \
              release-assets/* \
              --title "Solaris ${TAG_NAME}" \
              --generate-notes
          fi
